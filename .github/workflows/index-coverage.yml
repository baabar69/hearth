name: index-coverage

on:
  schedule:
    # Mondays 07:00 UTC (noon PKT): weekly Google index-coverage report.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect sitemap URLs and email the report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
        run: node scripts/gsc-coverage.mjs
